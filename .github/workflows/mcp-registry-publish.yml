name: Publish NotFair MCP registry metadata

on:
  push:
    branches: [main]
    paths:
      - "server.json"
      - ".github/workflows/mcp-registry-publish.yml"
  workflow_dispatch:

concurrency:
  group: mcp-registry-notfair
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install checksum-pinned MCP publisher
        env:
          PUBLISHER_VERSION: v1.7.9
          PUBLISHER_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/${archive}" \
            --output "${archive}"
          echo "${PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" mcp-publisher
          chmod +x mcp-publisher

      - name: Validate registry metadata
        run: ./mcp-publisher validate server.json

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish registry metadata
        run: ./mcp-publisher publish server.json
